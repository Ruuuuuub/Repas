<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes dîners malins</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : une colonne façon carnet de courses, onglets collés en haut, cartes "dîner" en liste. */
:root {
  --bg: #f3f6f1;
  --surface: #ffffff;
  --ink: #1b2a1f;
  --muted: #5d6b60;
  --line: #dbe3d8;
  --basil: #2f7d4a;
  --basil-soft: #e1f0e5;
  --mustard: #e3a92b;
  --mustard-soft: #fbf0d4;
  --danger: #b4432f;
  --danger-soft: #f8e2dc;
  --shadow: 0 1px 2px rgba(27, 42, 31, .06), 0 4px 14px rgba(27, 42, 31, .06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --surface: #1a231d; --ink: #e8efe9; --muted: #9eaba1; --line: #2b372f;
    --basil: #6cc28a; --basil-soft: #1f3527; --mustard: #f0bd4f; --mustard-soft: #3a3020;
    --danger: #f08a73; --danger-soft: #3d2420; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --surface: #1a231d; --ink: #e8efe9; --muted: #9eaba1; --line: #2b372f;
  --basil: #6cc28a; --basil-soft: #1f3527; --mustard: #f0bd4f; --mustard-soft: #3a3020;
  --danger: #f08a73; --danger-soft: #3d2420; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--basil); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 8px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; margin: 0; letter-spacing: -.01em; }
.brand h1 span { color: var(--basil); }
.brand .store { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
nav.tabs a {
  flex: 0 0 auto; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem;
  padding: 7px 14px; border-radius: 999px;
}
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs a .badge { font-size: .75rem; margin-left: 4px; opacity: .8; }

main { padding-block: 18px 60px; }
section.view { display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: .9rem; }

/* Bandeau budget */
.budget {
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px;
  display: grid; gap: 10px;
}
.budget .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.budget .big { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1; }
.budget .big small { font-size: .95rem; font-weight: 600; color: var(--muted); }
.meter { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--basil); border-radius: 99px; transition: width .3s; }
.meter.over i { background: var(--danger); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--basil-soft); color: var(--basil); }
.pill.warn { background: var(--danger-soft); color: var(--danger); }
.pill.neutral { background: var(--mustard-soft); color: var(--ink); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-weight: 600; font-size: .9rem;
}
a.btn { color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--basil); }
.btn.primary { background: var(--basil); color: #fff; border-color: var(--basil); }
:root[data-theme="dark"] .btn.primary { color: #0d1a11; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0d1a11; } }
.btn.small { padding: 5px 10px; font-size: .82rem; border-radius: 10px; }
.btn.ghost { background: transparent; }

/* Dîners */
.days { display: grid; gap: 10px; }
.day {
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px;
}
.day .dow { font-family: var(--f-display); font-weight: 800; font-size: .95rem; text-transform: uppercase; color: var(--basil); text-align: center; line-height: 1.1; }
.day .dow small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .7rem; color: var(--muted); text-transform: none; }
.day .info { min-width: 0; }
.day .name { font-weight: 600; background: none; border: 0; padding: 0; text-align: left; font-size: 1rem; line-height: 1.3; }
.day .name:hover { color: var(--basil); text-decoration: underline; }
.day .meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.day .price { text-align: right; }
.day .price b { font-family: var(--f-display); font-size: 1.1rem; display: block; }
.day .price span { font-size: .72rem; color: var(--muted); }
.day .tools { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; }
@media (min-width: 560px) {
  .day { grid-template-columns: 64px 1fr auto auto; }
  .day .tools { grid-column: auto; }
}

/* Courses */
.rayon { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.rayon h3 { margin: 0; padding: 12px 16px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item input { width: 20px; height: 20px; accent-color: var(--basil); }
.item label { min-width: 0; cursor: pointer; }
.item .qty { font-weight: 700; margin-right: 4px; }
.item .hint { display: block; font-size: .78rem; color: var(--muted); }
.item.done label { text-decoration: line-through; color: var(--muted); }
.item .cost { font-weight: 600; }
.placard { background: var(--mustard-soft); border-radius: 16px; padding: 14px 16px; font-size: .9rem; }
.placard b { display: block; margin-bottom: 4px; }

/* Prix */
.prices { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.prow { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .pname { min-width: 0; }
.prow .pname small { display: block; color: var(--muted); font-size: .78rem; }
.prow input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: right; }
.prow input.changed { border-color: var(--mustard); }
.rayon-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 16px 6px; background: var(--bg); }

/* Réglages */
.form { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 18px; }
.field { display: grid; gap: 8px; }
.field > label, .field > .lbl { font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; width: max-content; }
.stepper button { border: 0; background: var(--bg); width: 42px; height: 40px; font-size: 1.2rem; }
.stepper output { min-width: 56px; text-align: center; font-weight: 700; }
input[type="range"] { width: 100%; accent-color: var(--basil); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; }
.chip span { display: inline-block; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: .88rem; }
.chip input:checked + span { background: var(--basil); border-color: var(--basil); color: #fff; }
.chip input:focus-visible + span { outline: 2px solid var(--basil); outline-offset: 2px; }

/* Fenêtre recette / échange */
.overlay { position: fixed; inset: 0; background: rgba(10, 18, 12, .45); z-index: 20; display: grid; place-items: end center; }
@media (min-width: 640px) { .overlay { place-items: center; } }
.sheet {
  background: var(--surface); width: min(640px, 100%); max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px;
}
@media (min-width: 640px) { .sheet { border-radius: 20px; padding: 24px; } }
.sheet header { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet h2 { font-size: 1.4rem; }
.sheet ul, .sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.sheet h4 { margin: 0; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.close { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 99px; font-size: 1.1rem; flex: 0 0 auto; }
.alts { display: grid; gap: 6px; }
.alt { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.alt:hover { border-color: var(--basil); }
.alt small { display: block; color: var(--muted); font-size: .78rem; }
.alt .delta { font-weight: 700; font-size: .9rem; }
.alt .delta.up { color: var(--danger); }
.alt .delta.down { color: var(--basil); }
.alt.over { opacity: .6; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 30; }
.note { font-size: .82rem; color: var(--muted); }
textarea.copy { width: 100%; min-height: 160px; border-radius: 12px; border: 1px solid var(--line); padding: 10px; background: var(--bg); color: var(--ink); font: .85rem/1.4 ui-monospace, Menlo, monospace; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Mes dîners <span>malins</span></h1>
      <div class="store">Prix calés sur Picnic</div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#semaine" data-view="semaine">Semaine</a>
      <a href="#courses" data-view="courses">Courses <span class="badge num" id="badge-courses"></span></a>
      <a href="#reglages" data-view="reglages">Réglages</a>
      <a href="#prix" data-view="prix">Prix</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-semaine"></section>
  <section class="view" id="v-courses" hidden></section>
  <section class="view" id="v-reglages" hidden></section>
  <section class="view" id="v-prix" hidden></section>
</main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =========================================================

   [nom, rayon, taille du paquet, unité, prix €, libellé unité, allergènes, régime]
   ========================================================= */
const RAYONS = {

  epicerie: "Épicerie", surgeles: "Surgelés", boulangerie: "Pain"

   2. RECETTES  — quantités POUR 1 PERSONNE
   pl = ce qu'on a normalement dans les placards (non compté)
   ========================================================= */

  { id: "carbo", n: "Spaghetti à la carbonara", t: 20,

  { id: "patesthon", n: "Pâtes au thon à la tomate", t: 20,

/* =========================================================
   3. ÉTAT (gardé dans le navigateur)
   ========================================================= */
const KEY = "mes-diners-malins-v1";
const defaults = () => ({ personnes: 2, diners: 5, budget: 40, exclus: [], menu: [], coches: {}, prix: {}, favoris: [] });
let S = defaults();
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) S = Object.assign(defaults(), saved); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const eur = v => v.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const prix = id => (S.prix[id] != null ? S.prix[id] : PRODUITS[id][4]);
const R = id => RECETTES.find(r => r.id === id);

function infosRecette(r) {
  const al = new Set(), regime = new Set();
  r.ing.forEach(([p]) => { PRODUITS[p][6].forEach(a => al.add(a)); if (PRODUITS[p][7]) regime.add(PRODUITS[p][7]); });
  if (regime.has("porc")) regime.add("viande");
  return { al: [...al], regime: [...regime] };
}
function coutPortion(r) { return r.ing.reduce((s, [p, q]) => s + q / PRODUITS[p][2] * prix(p), 0); }

function autorisee(r) {
  const { al, regime } = infosRecette(r);
  for (const x of S.exclus) {
    if (x === "porc" && regime.includes("porc")) return false;
    if (x === "poisson" && regime.includes("poisson")) return false;
    if (x === "vege" && (regime.includes("viande") || regime.includes("poisson"))) return false;
    if (x === "express" && r.t > 30) return false;
    if (al.includes(x)) return false;
  }
  return true;
}

/* Liste de courses : on additionne tout, puis on achète des paquets entiers */
function liste(ids) {
  const besoin = {};
  ids.forEach(id => R(id).ing.forEach(([p, q]) => { besoin[p] = (besoin[p] || 0) + q * S.personnes; }));
  const lignes = Object.entries(besoin).map(([p, q]) => {
    const pack = PRODUITS[p][2];
    const nb = Math.max(1, Math.ceil(q / pack - 1e-6));
    return { p, besoin: q, nb, cout: nb * prix(p), reste: nb * pack - q };
  });
  return { lignes, total: lignes.reduce((s, l) => s + l.cout, 0) };
}
const totalDe = ids => liste(ids).total;

/* =========================================================
   4. CRÉATION DU MENU sous le budget
   ========================================================= */
function melange(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function creerMenu() {
  const pool = RECETTES.filter(autorisee).map(r => r.id);
  // les favoris passent en premier
  const fav = melange(pool.filter(id => S.favoris.includes(id)));
  const autres = melange(pool.filter(id => !S.favoris.includes(id)));
  let menu = [...fav, ...autres].slice(0, S.diners);
  for (let tour = 0; tour < 60; tour++) {
    const t = totalDe(menu);
    if (t <= S.budget) break;
    // on remplace le dîner le plus cher par un moins cher
    const ordre = menu.map((id, i) => [i, coutPortion(R(id))]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    let fait = false;
    for (const i of ordre) {
      const options = pool.filter(id => !menu.includes(id)).map(id => {
        const m = menu.slice(); m[i] = id; return [id, totalDe(m)];
      }).filter(([, t2]) => t2 < t - 0.01).sort((a, b) => a[1] - b[1]).slice(0, 3);
      if (options.length) { menu[i] = options[Math.floor(Math.random() * options.length)][0]; fait = true; break; }
    }
    if (!fait) break;
  }
  S.menu = menu; S.coches = {}; save();
}

/* =========================================================
   5. AFFICHAGE
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function qteTexte(p, q) {
  const [, , , u, , lab] = PRODUITS[p];
  if (u === "pc") {
    if (q < 0.3) return "¼ " + lab;
    if (q < 0.45) return "⅓ " + lab;
    const r = Math.round(q * 2) / 2, ent = Math.floor(r), demi = r % 1 ? "½" : "";
    return (ent ? ent + (demi ? " " + demi : "") : demi) + " " + lab + (r > 1 ? "s" : "");
  }
  if (u === "g") return q >= 1000 ? (q / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " kg" : Math.round(q / (q < 30 ? 1 : 5)) * (q < 30 ? 1 : 5) + " g";
  return q >= 1000 ? (q / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " L" : Math.round(q / 5) * 5 + " ml";
}
function nomCourt(p) { return PRODUITS[p][0].replace(/\s[\d×].*$/, "").replace(/\s\(.*\)$/, ""); }

        <span class="note" id="o-budget-pp"></span></div>
      <div class="field"><span class="lbl">Mes contraintes</span>
        <div class="chips">${EXCLUSIONS.map(([k, l]) => `<label class="chip"><input type="checkbox" id="x-${k.replace(/\s/g, "-")}" value="${k}" ${S.exclus.includes(k) ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>
        <span class="note">Les allergènes sont repérés à partir des produits. Vérifie toujours l'étiquette en cas d'allergie.</span></div>
      <div class="actions"><button type="submit" class="btn primary">Créer mon menu</button></div>
    </form>
    <div><h2>Mes favoris</h2><p class="sub">Les recettes avec un cœur reviennent en priorité. Ajoute-les depuis une fiche recette.</p></div>
    <div class="days">${S.favoris.length ? S.favoris.map(id => `<article class="day" style="grid-template-columns:1fr auto"><div class="info"><button class="name" data-voir="${id}">${esc(R(id).n)}</button></div><div class="price"><b class="num">${eur(coutPortion(R(id)))}</b><span>par pers.</span></div></article>`).join("") : `<p class="note">Pas encore de favori.</p>`}</div>`;
  const ppRepas = () => { $("#o-budget-pp").textContent = `Soit environ ${eur(S.budget / (S.diners * S.personnes))} par personne et par repas.`; };
  ppRepas();
  v.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    const k = b.dataset.step, lim = k === "personnes" ? [1, 8] : [1, 7];
    S[k] = Math.min(lim[1], Math.max(lim[0], S[k] + Number(b.dataset.d)));
    $("#o-" + k).textContent = S[k]; ppRepas(); save();
  });
  $("#budget").oninput = e => { S.budget = Number(e.target.value); $("#o-budget").textContent = eur(S.budget); ppRepas(); save(); };
  $("#form-menu").onsubmit = e => {
    e.preventDefault();
    S.exclus = [...v.querySelectorAll(".chip input:checked")].map(i => i.value);
    creerMenu(); renderAll(); location.hash = "semaine"; toast("Menu créé");
  };
}

function renderPrix() {
  const v = $("#v-prix");
  const parRayon = {};
  Object.keys(PRODUITS).forEach(p => (parRayon[PRODUITS[p][1]] = parRayon[PRODUITS[p][1]] || []).push(p));
  const nbModifs = Object.keys(S.prix).length;
  v.innerHTML = `
    <div><h2>Mes prix Picnic</h2><p class="sub">Ce sont des prix indicatifs. Corrige-les avec ceux de ton appli Picnic : tous les totaux se mettent à jour.</p></div>
    <div class="actions"><button class="btn" id="reset-prix" ${nbModifs ? "" : "disabled"}>Remettre les prix d'origine${nbModifs ? ` (${nbModifs} modifié${nbModifs > 1 ? "s" : ""})` : ""}</button></div>
    <div class="prices">
      ${Object.keys(RAYONS).filter(k => parRayon[k]).map(k => `<div class="rayon-title">${RAYONS[k]}</div>` + parRayon[k].map(p => `
        <div class="prow"><div class="pname">${esc(PRODUITS[p][0])}<small>Prix d'origine ${eur(PRODUITS[p][4])}</small></div>
        <input type="number" inputmode="decimal" step="0.01" min="0" id="p-${p}" data-prix="${p}" value="${prix(p).toFixed(2)}" class="num ${S.prix[p] != null ? "changed" : ""}" aria-label="Prix ${esc(PRODUITS[p][0])}"></div>`).join("")).join("")}
    </div>`;
  v.querySelectorAll("[data-prix]").forEach(i => i.onchange = () => {
    const val = parseFloat(String(i.value).replace(",", "."));
    if (isNaN(val) || val < 0) { i.value = prix(i.dataset.prix).toFixed(2); return; }
    if (Math.abs(val - PRODUITS[i.dataset.prix][4]) < 0.001) delete S.prix[i.dataset.prix]; else S.prix[i.dataset.prix] = val;
    save(); i.classList.toggle("changed", S.prix[i.dataset.prix] != null);
    renderSemaine(); renderCourses(); toast("Prix enregistré");
  });
  $("#reset-prix").onclick = () => { S.prix = {}; save(); renderAll(); toast("Prix d'origine remis"); };
}

/* Fiche recette */
function ouvrirRecette(id) {
  const r = R(id); const { al } = infosRecette(r); const fav = S.favoris.includes(id);
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.n)}">
    <header><div><h2>${esc(r.n)}</h2><p class="sub">${r.t} min · pour ${S.personnes} pers. · <span class="num">${eur(coutPortion(r))}</span> par pers.</p></div><button class="close" id="fermer" aria-label="Fermer">✕</button></header>
    ${al.length ? `<div class="chips">${al.map(a => `<span class="pill neutral">Contient : ${esc(a)}</span>`).join("")}</div>` : ""}
    <h4>Ingrédients</h4>
    <ul>${r.ing.map(([p, q]) => `<li><b class="num">${qteTexte(p, q * S.personnes)}</b> ${esc(nomCourt(p).toLowerCase())}</li>`).join("")}</ul>
    <p class="note">Placard : ${r.pl.map(esc).join(", ")}.</p>
    <h4>Préparation</h4>
    <ol>${r.st.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <div class="actions"><button class="btn ${fav ? "" : "primary"}" id="fav">${fav ? "Retirer des favoris" : "♥ Ajouter aux favoris"}</button></div>
  </div></div>`;
  bindModal();
  $("#fav").onclick = () => { S.favoris = fav ? S.favoris.filter(x => x !== id) : [...S.favoris, id]; save(); ouvrirRecette(id); renderSemaine(); renderReglages(); };
}

/* Changer un dîner */
function ouvrirChanger(i) {
  const actuel = totalDe(S.menu);
  const opts = RECETTES.filter(r => autorisee(r) && !S.menu.includes(r.id)).map(r => {
    const m = S.menu.slice(); m[i] = r.id; return { r, t: totalDe(m) };
  }).sort((a, b) => a.t - b.t);
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Changer le dîner">
    <header><div><h2>Changer le dîner du ${JOURS[i].toLowerCase()}</h2><p class="sub">À la place de « ${esc(R(S.menu[i]).n)} ». La liste de courses se met à jour toute seule.</p></div><button class="close" id="fermer" aria-label="Fermer">✕</button></header>
    <div class="alts">${opts.length ? opts.map(({ r, t }) => {
      const d = t - actuel; const over = t > S.budget;
      return `<button class="alt ${over ? "over" : ""}" data-pick="${r.id}"><span>${esc(r.n)}<small>${r.t} min · ${eur(coutPortion(r))} par pers.${over ? " · dépasse le budget" : ""}</small></span>
        <span class="delta num ${d > 0.005 ? "up" : d < -0.005 ? "down" : ""}">${d > 0.005 ? "+" : d < -0.005 ? "−" : "±"}${eur(Math.abs(d))}</span></button>`;
    }).join("") : `<p class="note">Aucune autre recette avec tes réglages.</p>`}</div>
  </div></div>`;
  bindModal();
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { S.menu[i] = b.dataset.pick; save(); fermer(); renderAll(); toast("Dîner changé"); });
}
function fermer() { $("#modal").innerHTML = ""; }
function bindModal() {
  $("#fermer").onclick = fermer; $("#fermer").focus();
  $("#ov").onclick = e => { if (e.target.id === "ov") fermer(); };
}
document.addEventListener("keydown", e => { if (e.key === "Escape") fermer(); });
document.addEventListener("click", e => {
  const v = e.target.closest("[data-voir]"); if (v) return ouvrirRecette(v.dataset.voir);
  const c = e.target.closest("[data-changer]"); if (c) return ouvrirChanger(Number(c.dataset.changer));
});

let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }

/* Onglets */
const VUES = ["semaine", "courses", "reglages", "prix"];
function route() {
  const h = location.hash.slice(1); const vue = VUES.includes(h) ? h : "semaine";
  VUES.forEach(n => { $("#v-" + n).hidden = n !== vue; });
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.view === vue) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
function renderAll() { renderSemaine(); renderCourses(); renderReglages(); renderPrix(); }

// Nettoyage si une recette a disparu, puis premier menu d'exemple
S.menu = S.menu.filter(id => R(id));
if (!S.menu.length) creerMenu();
renderAll(); route();
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
</script>
</body>
</html>
