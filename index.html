<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes dîners malins</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli mobile. En-tête collant avec le magasin, contenu en cartes illustrées, barre d'onglets en bas. */
:root {
  --bg: #f2f5ef;
  --surface: #ffffff;
  --surface-2: #e9efe5;
  --ink: #15231a;
  --muted: #5b6a5f;
  --line: #dbe3d6;
  --green: #1f7a4a;
  --green-soft: #dcefe2;
  --saffron: #f2b632;
  --saffron-soft: #fcf0cf;
  --red: #c2452d;
  --red-soft: #f9e1da;
  --tile: #e7eee2;
  --on-green: #ffffff;
  --shadow: 0 1px 2px rgba(21,35,26,.06), 0 8px 24px rgba(21,35,26,.07);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --surface: #18211b; --surface-2: #212c24; --ink: #e9f0ea; --muted: #9daba0; --line: #2a362e;
    --green: #67c58d; --green-soft: #1c3426; --saffron: #f4c255; --saffron-soft: #3a311d; --red: #f08b73; --red-soft: #3e231e;
    --tile: #223026; --on-green: #0c1a11; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --surface: #18211b; --surface-2: #212c24; --ink: #e9f0ea; --muted: #9daba0; --line: #2a362e;
  --green: #67c58d; --green-soft: #1c3426; --saffron: #f4c255; --saffron-soft: #3a311d; --red: #f08b73; --red-soft: #3e231e;
  --tile: #223026; --on-green: #0c1a11; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo svg { flex: 0 0 auto; }
.logo b { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em; white-space: nowrap; }
.logo b span { color: var(--green); }
.storechip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 600; font-size: .85rem; white-space: nowrap; }
.storechip i { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; font-style: normal; font-size: .66rem; font-weight: 800; color: var(--on-green); background: var(--green); }

main { padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px)); display: block; }
section.view { display: grid; gap: 18px; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); margin: 0; font-size: .9rem; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
.pagehead { display: grid; gap: 4px; }
.pagehead h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }

/* Résumé budget */
.summary { background: var(--ink); color: var(--bg); border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
.summary .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.summary .big { font-family: var(--f-display); font-weight: 800; font-size: 2.3rem; line-height: 1; letter-spacing: -.02em; }
.summary .big small { font-size: 1rem; font-weight: 500; opacity: .7; }
.summary .lbl { font-size: .8rem; opacity: .75; }
.summary .note { color: inherit; opacity: .8; }
.meter { height: 10px; background: color-mix(in srgb, var(--bg) 22%, transparent); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--saffron); border-radius: 99px; transition: width .4s; }
.meter.over i { background: var(--red); }
.stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: .8rem; }
.stats b { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.stats span { opacity: .75; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--green-soft); color: var(--green); white-space: nowrap; }
.pill.warn { background: var(--red-soft); color: var(--red); }
.pill.sun { background: var(--saffron-soft); color: var(--ink); }
.pill.line { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.summary .pill { background: var(--saffron); color: #1b1606; }
.summary .pill.warn { background: var(--red); color: #fff; }

.banner { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--saffron-soft); border-radius: 18px; padding: 14px 16px; }
.banner b { display: block; font-family: var(--f-display); font-size: 1.05rem; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: .9rem; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--green); }
.btn.primary { background: var(--green); color: var(--on-green); border-color: var(--green); }
.btn.sun { background: var(--saffron); color: #1b1606; border-color: var(--saffron); }
.btn.small { padding: 6px 12px; font-size: .82rem; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
.summary .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.summary .btn.sun { background: var(--saffron); color: #1b1606; border-color: var(--saffron); }

/* Cartes repas */
.cards { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.card .pic { position: relative; display: block; border: 0; padding: 0; background: var(--tile); width: 100%; }
.card .pic svg { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; }
.card .day { position: absolute; left: 12px; top: 12px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: .78rem; padding: 4px 10px; border-radius: 99px; box-shadow: var(--shadow); }
.card .price { position: absolute; right: 12px; top: 12px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: .82rem; padding: 4px 10px; border-radius: 99px; }
.card .body { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.card h3 { font-size: 1.12rem; font-weight: 700; line-height: 1.25; }
.linkish { all: unset; cursor: pointer; }
.linkish:hover { color: var(--green); }
.linkish:focus-visible { outline: 2px solid var(--green); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.macro { font-size: .8rem; color: var(--muted); }
.macro b { color: var(--ink); }

/* Lignes compactes */
.rows { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.rowi { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.rowi:last-child { border-bottom: 0; }
.rowi .thumb { border-radius: 14px; overflow: hidden; background: var(--tile); }
.rowi .thumb svg { display: block; width: 100%; height: auto; }
.rowi .t { min-width: 0; display: grid; }
.rowi .t b { font-weight: 600; line-height: 1.3; }
.rowi .t small { color: var(--muted); font-size: .8rem; }

.empty { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 12px; justify-items: start; }
.empty h2 { font-size: 1.25rem; }

/* Courses */
.rayon { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.rayon h3 { font-family: var(--f-body); margin: 0; padding: 12px 16px; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; background: var(--surface-2); }
.item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item input { width: 21px; height: 21px; accent-color: var(--green); }
.item label { min-width: 0; cursor: pointer; }
.item .qty { font-weight: 700; margin-right: 4px; color: var(--green); }
.item .hint { display: block; font-size: .77rem; color: var(--muted); }
.item.done label { text-decoration: line-through; color: var(--muted); }
.item .cost { font-weight: 600; }
.placard { background: var(--saffron-soft); border-radius: 18px; padding: 14px 16px; font-size: .9rem; }
.placard b { display: block; margin-bottom: 4px; }

/* Quiz */
.quiz { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 18px; }
.progress { display: grid; gap: 8px; }
.progress .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }
.progress .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.quiz h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; }
.qgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.qgrid.wide { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.opt { position: relative; display: block; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opt .face { display: grid; gap: 2px; align-content: start; border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; height: 100%; background: var(--surface); transition: border-color .15s, background .15s; }
.opt .face b { font-weight: 700; }
.opt .face small { color: var(--muted); font-size: .8rem; line-height: 1.35; }
.opt .face .ini { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; background: var(--surface-2); color: var(--ink); margin-bottom: 6px; font-size: .85rem; }
.opt input:checked + .face { border-color: var(--green); background: var(--green-soft); }
.opt input:checked + .face .ini { background: var(--green); color: var(--on-green); }
.opt input:focus-visible + .face { outline: 2px solid var(--green); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 8px 14px; border-radius: 99px; border: 1.5px solid var(--line); font-size: .88rem; font-weight: 500; background: var(--surface); }
.chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.no input:checked + span { background: var(--red); border-color: var(--red); color: #fff; }
.chip input:focus-visible + span { outline: 2px solid var(--green); outline-offset: 2px; }
.field { display: grid; gap: 8px; }
.field .lbl { font-weight: 700; }
.steppers { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.stepbox { border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stepbox span { font-weight: 600; font-size: .9rem; }
.stepper { display: inline-flex; align-items: center; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.stepper button { border: 0; background: transparent; width: 38px; height: 38px; font-size: 1.15rem; font-weight: 700; }
.stepper output { min-width: 28px; text-align: center; font-weight: 800; font-family: var(--f-display); font-size: 1.1rem; }
input[type="range"] { width: 100%; accent-color: var(--green); }
.qnav { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
.count b { color: var(--ink); }
.count.low b { color: var(--red); }
.stepsnav { display: flex; gap: 6px; flex-wrap: wrap; }
.stepsnav button { border: 0; background: var(--surface-2); border-radius: 99px; padding: 5px 11px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.stepsnav button[aria-current="step"] { background: var(--ink); color: var(--bg); }

/* Barre d'onglets */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 9px; text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 600; position: relative; }
nav.tabbar a svg { width: 24px; height: 24px; }
nav.tabbar a[aria-current="page"] { color: var(--green); }
nav.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--green); }
nav.tabbar .badge { position: absolute; top: 4px; left: 56%; background: var(--saffron); color: #1b1606; font-size: .62rem; font-weight: 800; border-radius: 99px; padding: 0 5px; line-height: 16px; }

/* Fenêtres */
.overlay { position: fixed; inset: 0; background: rgba(8, 14, 10, .5); z-index: 20; display: grid; place-items: end center; }
@media (min-width: 680px) { .overlay { place-items: center; } }
.sheet { background: var(--surface); width: min(680px, 100%); max-height: 90vh; overflow-y: auto; border-radius: 24px 24px 0 0; display: grid; gap: 14px; padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 680px) { .sheet { border-radius: 24px; } }
.sheet .in { display: grid; gap: 14px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.sheet .hero { position: relative; background: var(--tile); }
.sheet .hero svg { display: block; width: 100%; height: auto; max-height: 300px; }
.sheet header { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding-top: 18px; }
.sheet h2 { font-size: 1.45rem; font-weight: 800; line-height: 1.15; }
.sheet h4 { margin: 0; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.sheet ul, .sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.close { border: 0; background: var(--surface-2); width: 38px; height: 38px; border-radius: 99px; font-size: 1.05rem; flex: 0 0 auto; }
.hero .close { position: absolute; right: 12px; top: 12px; background: var(--surface); box-shadow: var(--shadow); }
.nutri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nutri div { background: var(--surface-2); border-radius: 14px; padding: 10px 4px; text-align: center; }
.nutri b { display: block; font-family: var(--f-display); font-size: 1.1rem; }
.nutri span { font-size: .72rem; color: var(--muted); }
.alts { display: grid; gap: 8px; }
.alt { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 8px 12px 8px 8px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); }
.alt:hover { border-color: var(--green); }
.alt .thumb { border-radius: 10px; overflow: hidden; background: var(--tile); }
.alt .thumb svg { display: block; width: 100%; height: auto; }
.alt small { display: block; color: var(--muted); font-size: .78rem; }
.alt .delta { font-weight: 700; font-size: .9rem; }
.alt .delta.up { color: var(--red); }
.alt .delta.down { color: var(--green); }
.alt.over { opacity: .6; }
.prow { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow .pname { min-width: 0; }
.prow .pname small { display: block; color: var(--muted); font-size: .78rem; }
.prow input { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: right; }
.prow input.changed { border-color: var(--saffron); }
.storegrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 30; white-space: nowrap; }
textarea.copy { width: 100%; min-height: 160px; border-radius: 12px; border: 1px solid var(--line); padding: 10px; background: var(--bg); color: var(--ink); font: .85rem/1.4 ui-monospace, Menlo, monospace; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--green)"/><circle cx="17" cy="17" r="10" fill="var(--surface)"/><circle cx="14" cy="15" r="3" fill="var(--saffron)"/><circle cx="20" cy="19" r="2.5" fill="var(--red)"/><path d="M13 21c2 1 4 1 6-1" stroke="var(--green)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <b>Dîners <span>malins</span></b>
    </div>
    <button class="storechip" id="storechip" aria-label="Changer de magasin"><i id="store-ini">P</i><span id="store-name">Picnic</span></button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-diners"></section>
  <section class="view" id="v-dejeuners" hidden></section>
  <section class="view" id="v-ptitdej" hidden></section>
  <section class="view" id="v-courses" hidden></section>
  <section class="view" id="v-profil" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections"><div class="in">
  <a href="#diners" data-view="diners"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Dîners</a>
  <a href="#dejeuners" data-view="dejeuners"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Déjeuners</a>

/* =====================================================================

const eur = v => v.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const R = id => RECETTES.find(r => r.id === id);
const VIANDES = ["porc", "boeuf", "agneau", "volaille"];
const COQUES = ["noix", "cajou", "pistache", "noisette", "amande"];

// Infos fixes de chaque recette : allergènes, origine animale, nutrition
RECETTES.forEach(r => {
  const al = new Set(), anim = new Set(), hate = new Set();
  let kcal = 0, prot = 0, gluc = 0;
  r.ing.forEach(([id, q]) => {
    const x = PR[id];
    x.al.forEach(a => al.add(a));
    if (x.anim) anim.add(x.anim);
    x.hate.forEach(h => hate.add(h));
    const f = x.unit === "pc" ? q : q / 100;
    kcal += x.kcal * f; prot += x.prot * f; gluc += x.gluc * f;
  });
  if ([...al].some(a => COQUES.includes(a))) al.add("fruits_coque");
  if (r.v.includes("epice")) hate.add("epices");
  // les plats sont cuits avec un peu de matière grasse (≈ 1 c. à soupe d'huile)
  if (r.m !== "b" && r.pl.some(x => /huile|beurre/.test(x))) kcal += 60;
  r.al = al; r.anim = anim; r.hate = hate;
  r.kcal = Math.round(kcal); r.prot = Math.round(prot); r.gluc = Math.round(gluc);
  r.viande = [...anim].some(a => VIANDES.includes(a));
  r.mer = anim.has("poisson") || anim.has("fdm");
});

function prix(id) {
  const k = S.magasin + ":" + id;
  if (S.prix[k] != null) return S.prix[k];
  return Math.round(PR[id].price * MAG[S.magasin].idx * 100) / 100;
}
const coutPortion = r => r.ing.reduce((s, [id, q]) => s + q / PR[id].pack * prix(id), 0);

function equipOk(r) {
  if (!r.eq) return true;
  return r.eq.split(",").every(req => req.split("/").some(a => S.equip.includes(a)));
}
function exclue(r) {
  if (S.regime === "vegan" && r.anim.size) return true;
  if (S.regime === "vege" && (r.viande || r.mer)) return true;
  if (S.regime === "pesco" && r.viande) return true;
  if (S.sansLactose && r.al.has("lactose")) return true;
  for (const a of S.allergies) if (r.al.has(a) || (a === "lait" && r.al.has("lactose"))) return true;
  for (const h of S.deteste) if (r.hate.has(h)) return true;
  if (!equipOk(r)) return true;
  if (S.temps && r.t > S.temps) return true;
  if (r.d > S.niveau) return true;
  return false;
}
const pool = code => RECETTES.filter(r => r.m.includes(code) && !exclue(r));

function vibeMatch(r, v) {
  switch (v) {
    case "gourmand": return r.v.includes("gourmand");
    case "viande": return r.viande;
    case "mer": return r.mer;
    case "lowcarb": return r.gluc < 30;
    case "leger": return r.kcal < 500;
    case "ventre": return r.v.includes("ventre");
    case "batch": return r.v.includes("batch");
    case "flemme": return r.v.includes("flemme") || (r.ing.length <= 4 && r.t <= 20);
  }
  return false;
}
function typeMatch(r) {
  if (S.type === "gras") return r.v.includes("gourmand") || r.kcal >= 700;
  if (S.type === "proteine") return r.prot >= 30;
  if (S.type === "maxi") return r.prot >= 40;
  return r.kcal >= 400 && r.kcal <= 750 && r.prot >= 18;
}
function score(r) {
  let s = 1;
  S.vibes.forEach(v => { if (vibeMatch(r, v)) s += 2; });
  if (typeMatch(r)) s += S.type === "equilibre" ? 1.5 : 2.5;
  if (S.cuisine !== "mix" && r.c === S.cuisine) s += 2;
  if (S.regime === "flexi" && !r.viande && !r.mer) s += 1;
  if (S.favoris.includes(r.id)) s += 3;
  return s;
}

/* Liste de courses : on additionne tout, puis on achète des paquets entiers */
const nbRestes = m => S.dejMode === "restes" ? Math.min(S.dej, m.diner.length) : 0;
function portions(m) {
  const out = [];
  m.diner.forEach((id, i) => out.push([id, S.personnes * (i < nbRestes(m) ? 2 : 1)]));
  if (S.dejMode !== "restes") m.dej.forEach(id => out.push([id, S.personnes]));
  m.pdj.forEach(id => out.push([id, S.personnes]));
  return out;
}
function liste(m = S.menu) {
  const besoin = {}, source = {};
  portions(m).forEach(([id, n]) => R(id).ing.forEach(([p, q]) => {
    besoin[p] = (besoin[p] || 0) + q * n;
    (source[p] = source[p] || new Set()).add(id);
  }));
  const lignes = Object.entries(besoin).map(([p, q]) => {
    const pack = PR[p].pack, nb = Math.max(1, Math.ceil(q / pack - 1e-6));
    return { p, besoin: q, nb, cout: nb * prix(p), reste: nb * pack - q, src: source[p].size };
  });
  return { lignes, total: lignes.reduce((s, l) => s + l.cout, 0) };
}
const totalDe = m => liste(m).total;

/* =====================================================================
   7. L'ALGORITHME : choisir selon le profil, puis tenir le budget
   ===================================================================== */
function tirage(candidats, n, deja, capViande) {
  const choisis = [], dispo = candidats.filter(r => !deja.includes(r.id));
  let viandes = deja.filter(id => R(id).viande || R(id).mer).length;
  while (choisis.length < n && dispo.length) {
    const tot = dispo.reduce((s, r) => s + score(r), 0);
    let x = Math.random() * tot, k = 0;
    for (; k < dispo.length - 1; k++) { x -= score(dispo[k]); if (x <= 0) break; }
    const r = dispo.splice(k, 1)[0];
    if ((r.viande || r.mer) && viandes >= capViande) continue;
    if (r.viande || r.mer) viandes++;
    choisis.push(r.id);
  }
  return choisis;
}
function creerMenu() {
  const cap = S.regime === "flexi" ? 3 : 99;
  const m = { diner: [], dej: [], pdj: [] };
  m.diner = tirage(pool("d"), S.diners, [], cap);
  if (S.dejMode === "recettes") m.dej = tirage(pool("l"), S.dej, m.diner, cap);
  const bases = tirage(pool("b"), Math.min(2, S.pdj), [], 99);
  m.pdj = bases.length ? Array.from({ length: S.pdj }, (_, i) => bases[i % bases.length]) : [];
  ajusterBudget(m);
  S.menu = m; S.coches = {}; save();
}
function ajusterBudget(m) {
  const pools = { diner: pool("d"), dej: pool("l") };
  for (let tour = 0; tour < 80; tour++) {
    const t = totalDe(m);
    if (t <= S.budget) return;
    const slots = [];
    m.diner.forEach((id, i) => slots.push(["diner", i, coutPortion(R(id))]));
    m.dej.forEach((id, i) => slots.push(["dej", i, coutPortion(R(id))]));
    slots.sort((a, b) => b[2] - a[2]);
    let fait = false;
    for (const [repas, i] of slots) {
      const utilises = [...m.diner, ...m.dej];
      const options = pools[repas].filter(r => !utilises.includes(r.id)).map(r => {
        const m2 = { ...m, [repas]: m[repas].slice() }; m2[repas][i] = r.id; return [r, totalDe(m2)];
      }).filter(([, t2]) => t2 < t - 0.01).sort((a, b) => a[1] - b[1]).slice(0, 4);
      if (options.length) {
        options.sort((a, b) => score(b[0]) - score(a[0]));
        m[repas][i] = options[Math.random() < 0.7 ? 0 : Math.floor(Math.random() * options.length)][0].id;
        fait = true; break;
      }
    }
    if (!fait) {
      // dernier recours : le petit-déjeuner le moins cher
      const pB = pool("b").sort((a, b) => coutPortion(a) - coutPortion(b));
      if (pB.length && m.pdj.some(id => id !== pB[0].id)) { m.pdj = m.pdj.map(() => pB[0].id); continue; }
      return;
    }
  }
}

function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const t = f < 0 ? 0 : 255, a = Math.abs(f); r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b); return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
const ORDRE = { sauce: 0, grain: 1, strand: 1, tube: 1, slice: 1, chunk: 2, round: 3, leaf: 3, egg: 3, cheese: 4 };
let uid = 0; const cacheIllu = {};
function illu(r) {
  if (cacheIllu[r.id]) return cacheIllu[r.id];
  const rnd = rng(r.id), clip = "clip" + (uid++);
  const cx = 120, cy = 82, FR = 44;
  const bowl = r.m === "b" || /bowl|bol|curry|dahl|chili|soupe|porridge|risotto|yaourt|skyr|smoothie|couscous|navarin/i.test(r.n);
  const f1 = v => v.toFixed(1);
  const pt = (rad, ox = 0, oy = 0) => { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * rad; return [cx + ox + Math.cos(a) * d, cy + oy + Math.sin(a) * d * 0.92]; };
  const poids = r.ing.map(([p, q]) => [PR[p], PR[p].unit === "pc" ? q * PR[p].pw : q]).filter(([x]) => x.sh !== "none");
  const tot = poids.reduce((s, [, w]) => s + w, 0) || 1;
  poids.sort((a, b) => ORDRE[a[0].sh] - ORDRE[b[0].sh]);
  let food = "", sauceFaite = false;
  poids.forEach(([x, w]) => {
    const share = w / tot, c = x.col, dk = shade(c, -0.25);
    const n = (min, max, k) => Math.max(min, Math.min(max, Math.round(share * k)));
    const rot = (px, py, a) => `transform="rotate(${a | 0} ${f1(px)} ${f1(py)})"`;
    if (x.sh === "sauce") {
      const rr = sauceFaite ? FR * 0.45 : FR * 0.98, ox = sauceFaite ? (rnd() - .5) * 30 : 0, oy = sauceFaite ? (rnd() - .5) * 20 : 0;
      let d = ""; for (let i = 0; i <= 18; i++) { const a = i / 18 * Math.PI * 2, rad = rr * (0.88 + rnd() * 0.12); d += (i ? "L" : "M") + f1(cx + ox + Math.cos(a) * rad) + " " + f1(cy + oy + Math.sin(a) * rad * 0.92); }
      food += `<path d="${d}Z" fill="${c}" opacity=".96"/>`; sauceFaite = true;
    } else if (x.sh === "grain") {
      const ox = (rnd() - .5) * 26, oy = (rnd() - .5) * 18, k = n(40, 110, 220);
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.68, ox, oy); food += `<ellipse cx="${f1(px)}" cy="${f1(py)}" rx="2.6" ry="1.5" ${rot(px, py, rnd() * 180)} fill="${c}" stroke="${dk}" stroke-width=".3"/>`; }
    } else if (x.sh === "strand") {
      const k = n(12, 22, 30);
      for (let i = 0; i < k; i++) { const [x1, y1] = pt(FR * 0.8), a = rnd() * Math.PI * 2, L = 26 + rnd() * 30, x2 = x1 + Math.cos(a) * L, y2 = y1 + Math.sin(a) * L; food += `<path d="M${f1(x1)} ${f1(y1)} Q${f1((x1 + x2) / 2 + (rnd() - .5) * 26)} ${f1((y1 + y2) / 2 + (rnd() - .5) * 26)} ${f1(x2)} ${f1(y2)}" stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`; }
    } else if (x.sh === "tube") {
      const k = n(8, 20, 30);
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.8); food += `<rect x="${f1(px - 7)}" y="${f1(py - 3)}" width="14" height="6" rx="3" ${rot(px, py, rnd() * 180)} fill="${c}" stroke="${dk}" stroke-width=".6"/>`; }
    } else if (x.sh === "slice") {
      const k = share > 0.35 ? 2 : 1;
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.5), wv = 44 + rnd() * 16; food += `<rect x="${f1(px - wv / 2)}" y="${f1(py - 12)}" width="${f1(wv)}" height="24" rx="10" ${rot(px, py, (rnd() - .5) * 70)} fill="${c}" stroke="${dk}" stroke-width="1"/>`; }
    } else if (x.sh === "chunk") {
      const k = n(4, 13, 26);
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.78), s = 9 + rnd() * 6; food += `<rect x="${f1(px - s / 2)}" y="${f1(py - s / 2.4)}" width="${f1(s)}" height="${f1(s * 0.82)}" rx="3" ${rot(px, py, rnd() * 90)} fill="${c}" stroke="${dk}" stroke-width=".7"/>`; }
    } else if (x.sh === "round") {
      const k = n(5, 16, 34);
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.82), s = 3.4 + rnd() * 2.4; food += `<circle cx="${f1(px)}" cy="${f1(py)}" r="${f1(s)}" fill="${c}" stroke="${dk}" stroke-width=".6"/><circle cx="${f1(px - s / 3)}" cy="${f1(py - s / 3)}" r="${f1(s / 3.5)}" fill="#fff" opacity=".35"/>`; }
    } else if (x.sh === "leaf") {
      const k = n(4, 11, 24);
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.82), a = rnd() * 180; food += `<ellipse cx="${f1(px)}" cy="${f1(py)}" rx="9" ry="4.2" ${rot(px, py, a)} fill="${c}" stroke="${dk}" stroke-width=".6"/><path d="M${f1(px - 7)} ${f1(py)}h14" stroke="${shade(c, .35)}" stroke-width=".7" ${rot(px, py, a)}/>`; }
    } else if (x.sh === "egg") {
      const k = Math.min(2, Math.max(1, Math.round(share * 4)));
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.45); food += `<ellipse cx="${f1(px)}" cy="${f1(py)}" rx="14" ry="12" fill="#fffdf6" stroke="#e8e2cf" stroke-width=".8"/><circle cx="${f1(px + 1)}" cy="${f1(py - 1)}" r="5.6" fill="#f5b316"/><circle cx="${f1(px - 0.8)}" cy="${f1(py - 2.8)}" r="1.6" fill="#fff" opacity=".6"/>`; }
    } else if (x.sh === "cheese") {
      const k = n(14, 34, 80);
      for (let i = 0; i < k; i++) { const [px, py] = pt(FR * 0.7); food += `<rect x="${f1(px - 3.5)}" y="${f1(py - .8)}" width="7" height="1.6" rx=".8" ${rot(px, py, rnd() * 180)} fill="${c}"/>`; }
    }
  });
  if (r.m !== "b" && !poids.some(([x]) => x.sh === "leaf")) {
    for (let i = 0; i < 5; i++) { const [px, py] = pt(FR * 0.6), a = rnd() * 180; food += `<ellipse cx="${f1(px)}" cy="${f1(py)}" rx="3.6" ry="1.8" transform="rotate(${a | 0} ${f1(px)} ${f1(py)})" fill="#3f8f3a"/>`; }
  }
  const table = r.c === "mo" ? "var(--saffron-soft)" : "var(--tile)";
  const couverts = `<rect x="${cx + 76}" y="24" width="4" height="116" rx="2" fill="var(--line)"/><rect x="${cx - 82}" y="30" width="5" height="110" rx="2.5" fill="var(--line)"/>`;
  const base = poids[0] ? poids[0][0].col : "#eeeeee";
  const plate = bowl
    ? `<ellipse cx="${cx}" cy="${cy + 6}" rx="64" ry="60" fill="rgba(0,0,0,.08)"/><circle cx="${cx}" cy="${cy}" r="62" fill="#f7f4ec" stroke="#e2ddcf"/><circle cx="${cx}" cy="${cy}" r="54" fill="${shade(base, -0.05)}" opacity=".35"/>`
    : `<ellipse cx="${cx}" cy="${cy + 6}" rx="66" ry="62" fill="rgba(0,0,0,.08)"/><circle cx="${cx}" cy="${cy}" r="64" fill="#fbfaf6" stroke="#e6e2d6"/><circle cx="${cx}" cy="${cy}" r="51" fill="#ffffff" stroke="#efece3"/>`;
  const svg = `<svg viewBox="0 0 240 160" role="img" aria-label="Illustration : ${esc(r.n)}"><defs><clipPath id="${clip}"><circle cx="${cx}" cy="${cy}" r="${bowl ? 53 : 50}"/></clipPath></defs><rect width="240" height="160" fill="${table}"/>${couverts}${plate}<g clip-path="url(#${clip})">${food}</g></svg>`;
  return (cacheIllu[r.id] = svg);
}

const $ = s => document.querySelector(s);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function qteTexte(p, q) {
  const x = PR[p];
  if (x.unit === "pc") {
    if (q < 0.3) return "¼ " + x.lab;
    if (q < 0.45) return "⅓ " + x.lab;
    const r = Math.round(q * 2) / 2, ent = Math.floor(r), demi = r % 1 ? "½" : "";
    return (ent ? ent + (demi ? " " + demi : "") : demi) + " " + x.lab + (r > 1 ? "s" : "");
  }
  const u = x.unit === "g" ? ["g", "kg"] : ["ml", "L"];
  if (q >= 1000) return (q / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " " + u[1];
  const step = q < 30 ? 1 : 5;
  return Math.round(q / step) * step + " " + u[0];
}
const nomCourt = p => PR[p].name.replace(/\s[\d×].*$/, "").replace(/\s\(.*\)$/, "");

function tagsRecette(r) {
  const t = [];
  if (r.t <= 20) t.push(`<span class="pill">Express</span>`);
  if (r.v.includes("batch")) t.push(`<span class="pill sun">À l'avance</span>`);
  if (r.prot >= 30) t.push(`<span class="pill line">Riche en protéines</span>`);
  if (r.gluc < 30 && r.m !== "b") t.push(`<span class="pill line">Low carb</span>`);
  if (r.kcal < 500 && r.m !== "b") t.push(`<span class="pill line">Léger</span>`);
  if (!r.anim.size) t.push(`<span class="pill line">Vegan</span>`);
  else if (!r.viande && !r.mer) t.push(`<span class="pill line">Végé</span>`);
  return t.slice(0, 4).join("");
}

function opt(type, name, value, titre, sous, checked, ini) {
  const id = `q-${name}-${String(value).replace(/\W/g, "_")}`;

}
function chip(name, value, label, checked, cls = "") {
  return `<label class="chip ${cls}"><input type="checkbox" name="${name}" id="q-${name}-${value}" value="${value}" ${checked ? "checked" : ""}><span>${label}</span></label>`;
}
function stepper(k, min, max) {
  return `<span class="stepper"><button type="button" data-step="${k}" data-d="-1" data-min="${min}" data-max="${max}" aria-label="Moins">−</button><output class="num" id="o-${k}">${S[k]}</output><button type="button" data-step="${k}" data-d="1" data-min="${min}" data-max="${max}" aria-label="Plus">+</button></span>`;
}
function bindStepper(root, after) {
  root.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    const k = b.dataset.step;
    S[k] = Math.min(Number(b.dataset.max), Math.max(Number(b.dataset.min), S[k] + Number(b.dataset.d)));
    root.querySelector("#o-" + k).textContent = S[k]; save();
    if (after) after(k);
  });
}

      <div class="qgrid wide">${REGIMES.map(([k, t, s]) => opt("radio", "regime", k, t, s, S.regime === k)).join("")}</div>
      <div class="field"><span class="lbl">Lactose</span><div class="qgrid">${opt("radio", "lactose", "avec", "Avec lactose", "", !S.sansLactose)}${opt("radio", "lactose", "sans", "Sans lactose", "Pas de lait, crème, yaourt…", S.sansLactose)}</div></div>` },
  { t: "As-tu des allergies ?", s: "Les recettes qui en contiennent sont retirées. Vérifie toujours les étiquettes.", html: () => `<div class="chips">${ALLERGIES.map(([k, l]) => chip("allergies", k, l, S.allergies.includes(k), "no")).join("")}</div>` },
  { t: "Ce que tu détestes", s: "Ces aliments n'apparaîtront jamais dans ton menu.", html: () => `<div class="chips">${DETESTE.map(([k, l]) => chip("deteste", k, l, S.deteste.includes(k), "no")).join("")}</div>` },
  { t: "Ton style de repas", s: "", html: () => `
      <div class="field"><span class="lbl">Type de repas</span><div class="qgrid">${TYPES.map(([k, t, s]) => opt("radio", "type", k, t, s, S.type === k)).join("")}</div></div>
      <div class="field"><span class="lbl">Type de cuisine</span><div class="qgrid">${CUISINES.map(([k, t, s]) => opt("radio", "cuisine", k, t, s, S.cuisine === k)).join("")}</div></div>` },
  { t: "Quelle vibe pour tes dîners ?", s: "Choisis-en autant que tu veux. Ce sont des envies : elles passent en priorité, sans tout bloquer.", html: () => `<div class="qgrid wide">${VIBES.map(([k, t, s]) => opt("checkbox", "vibes", k, t, s, S.vibes.includes(k))).join("")}</div>` },
  { t: "Qu'as-tu dans ta cuisine ?", s: "On évite les recettes qui demandent un appareil que tu n'as pas.", html: () => `<div class="chips">${EQUIPEMENTS.map(([k, l]) => chip("equip", k, l, S.equip.includes(k))).join("")}</div>` },
  { t: "Ton temps et ton niveau", s: "", html: () => `
      <div class="field"><span class="lbl">Temps maximum en cuisine</span><div class="qgrid">${TEMPS.map(([k, t, s]) => opt("radio", "temps", k, t, s, S.temps === k)).join("")}</div></div>
      <div class="field"><span class="lbl">Ton niveau</span><div class="qgrid">${NIVEAUX.map(([k, t, s]) => opt("radio", "niveau", k, t, s, S.niveau === k)).join("")}</div></div>` }
];
let etape = 0;
function compteur() {
  const d = pool("d").length, l = pool("l").length, b = pool("b").length;
  return `<span class="count ${d < S.diners ? "low" : ""}"><b>${d}</b> dîners, <b>${l}</b> déj. et <b>${b}</b> p'tits déj compatibles</span>`;
}
function renderProfil() {
  const v = $("#v-profil"), E = ETAPES[etape];
  v.innerHTML = `
    <div class="pagehead"><span class="eyebrow">Mon profil</span><h1>Crée ton menu</h1></div>
    <form class="quiz" id="quiz">
      <div class="progress"><div class="meta"><span>Étape ${etape + 1} sur ${ETAPES.length}</span><span id="compteur">${compteur()}</span></div><div class="bar"><i style="width:${(etape + 1) / ETAPES.length * 100}%"></i></div></div>
      <div class="stepsnav">${ETAPES.map((e, i) => `<button type="button" data-goto="${i}" ${i === etape ? 'aria-current="step"' : ""} aria-label="Étape ${i + 1}">${i + 1}</button>`).join("")}</div>
      <div><h2>${E.t}</h2>${E.s ? `<p class="sub">${E.s}</p>` : ""}</div>
      ${E.html()}
      <div class="qnav">
        <button type="button" class="btn ghost" id="prec" ${etape === 0 ? "disabled" : ""}>Précédent</button>
        <div class="actions">${etape < ETAPES.length - 1 ? `<button type="submit" class="btn" id="direct">Générer maintenant</button><button type="button" class="btn primary" id="suiv">Suivant</button>` : `<button type="submit" class="btn primary">Générer mon menu</button>`}</div>
      </div>
    </form>
    ${S.favoris.length ? `<div class="pagehead"><span class="eyebrow">Ils reviennent plus souvent</span><h2 style="font-size:1.4rem">Mes favoris</h2></div><div class="rows">${S.favoris.map(id => { const r = R(id); return `<div class="rowi"><div class="thumb">${illu(r)}</div><div class="t"><b><button class="linkish" data-voir="${id}">${esc(r.n)}</button></b><small class="num">${eur(coutPortion(r))} par pers.</small></div><span></span></div>`; }).join("")}</div>` : ""}`;
  const f = $("#quiz");
  const maj = () => { $("#compteur").innerHTML = compteur(); save(); };
  f.addEventListener("change", e => {
    const i = e.target; if (!i.name) return;
    if (i.type === "radio") {
      if (i.name === "lactose") S.sansLactose = i.value === "sans";
      else if (i.name === "temps" || i.name === "niveau") S[i.name] = Number(i.value);
      else { S[i.name] = i.value; if (i.name === "magasin") majMagasin(); }
    } else if (i.type === "checkbox") {
      S[i.name] = [...f.querySelectorAll(`input[name="${i.name}"]:checked`)].map(x => x.value);
    }
    maj();
  });
  const pp = () => { const el = $("#o-budget-pp"); if (el) { const n = S.personnes * (S.diners + S.dej + S.pdj * 0.4); el.textContent = `Repère : environ ${eur(S.budget / Math.max(1, n))} par personne et par repas.`; } };
  bindStepper(f, () => { pp(); maj(); });
  const bud = $("#budget"); if (bud) { pp(); bud.oninput = () => { S.budget = Number(bud.value); $("#o-budget").textContent = eur(S.budget); pp(); save(); }; }
  f.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { etape = Number(b.dataset.goto); renderProfil(); });
  $("#prec").onclick = () => { etape = Math.max(0, etape - 1); renderProfil(); window.scrollTo(0, 0); };
  const s = $("#suiv"); if (s) s.onclick = () => { etape++; renderProfil(); window.scrollTo(0, 0); };
  f.onsubmit = e => { e.preventDefault(); S.profilFait = true; creerMenu(); renderAll(); location.hash = "diners"; toast("Ton menu est prêt"); };
}

/* ——— Fenêtres ——— */
function ouvrirRecette(id) {
  const r = R(id), fav = S.favoris.includes(id), pour = S.personnes;
  const al = [...r.al].map(a => (ALLERGIES.find(x => x[0] === a) || [a, a])[1]);
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.n)}">
    <div class="hero">${illu(r)}<button class="close" id="fermer" aria-label="Fermer">✕</button></div>
    <div class="in">
      <div><h2>${esc(r.n)}</h2><p class="sub">${r.t} min · niveau ${["", "facile", "moyen", "avancé"][r.d]} · pour ${pour} pers. · ${r.c === "mo" ? "cuisine du monde" : "classique"}</p></div>
      <div class="tags">${tagsRecette(r)}</div>
      <div class="nutri num"><div><b>${r.kcal}</b><span>kcal</span></div><div><b>${r.prot} g</b><span>protéines</span></div><div><b>${r.gluc} g</b><span>glucides</span></div><div><b>${eur(coutPortion(r))}</b><span>par pers.</span></div></div>
      ${al.length ? `<p class="note"><b>Allergènes :</b> ${al.map(esc).join(", ")}. Vérifie les étiquettes, les recettes des marques varient.</p>` : `<p class="note">Aucun allergène majeur repéré. Vérifie quand même les étiquettes.</p>`}
      <h4>Ingrédients pour ${pour} pers.</h4>
      <ul>${r.ing.map(([p, q]) => `<li><b class="num">${qteTexte(p, q * pour)}</b> ${esc(nomCourt(p).toLowerCase())}</li>`).join("")}</ul>
      ${r.pl.length ? `<p class="note">Placard : ${r.pl.map(esc).join(", ")}.</p>` : ""}
      <h4>Préparation</h4>
      <ol>${r.st.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <div class="actions"><button class="btn ${fav ? "" : "primary"}" id="fav">${fav ? "Retirer des favoris" : "♥ Ajouter aux favoris"}</button></div>
    </div>
  </div></div>`;
  bindModal();
  $("#fav").onclick = () => { S.favoris = fav ? S.favoris.filter(x => x !== id) : [...S.favoris, id]; save(); ouvrirRecette(id); renderProfil(); toast(fav ? "Retiré des favoris" : "Ajouté aux favoris"); };
}

function ouvrirChanger(repas, i) {
  const code = { diner: "d", dej: "l", pdj: "b" }[repas];
  const actuel = totalDe(S.menu);
  const utilises = repas === "pdj" ? [S.menu.pdj[i]] : [...S.menu.diner, ...S.menu.dej];
  const opts = pool(code).filter(r => !utilises.includes(r.id)).map(r => {
    const m = { ...S.menu, [repas]: S.menu[repas].slice() }; m[repas][i] = r.id; return { r, t: totalDe(m) };
  }).sort((a, b) => score(b.r) - score(a.r) || a.t - b.t);
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Changer le repas">
    <div class="in"><header><div><h2>Changer : ${JOURS[i].toLowerCase()}</h2><p class="sub">À la place de « ${esc(R(S.menu[repas][i]).n)} ». Les plus adaptés à ton profil sont en haut. Ta liste de courses suit.</p></div><button class="close" id="fermer" aria-label="Fermer">✕</button></header>
    <div class="alts">${opts.length ? opts.map(({ r, t }) => {
      const d = t - actuel, over = t > S.budget;
      return `<button class="alt ${over ? "over" : ""}" data-pick="${r.id}"><span class="thumb">${illu(r)}</span><span>${esc(r.n)}<small class="num">${r.t} min · ${r.kcal} kcal · ${eur(coutPortion(r))}/pers.${over ? " · dépasse le budget" : ""}</small></span>
        <span class="delta num ${d > 0.005 ? "up" : d < -0.005 ? "down" : ""}">${d > 0.005 ? "+" : d < -0.005 ? "−" : "±"}${eur(Math.abs(d))}</span></button>`;
    }).join("") : `<p class="note">Aucune autre recette compatible avec ton profil.</p>`}</div></div>
  </div></div>`;
  bindModal();
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { S.menu[repas][i] = b.dataset.pick; save(); fermer(); renderAll(); toast("Repas changé"); });
}

function ouvrirMagasin() {
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Choisir mon magasin">
    <div class="in"><header><div><h2>Mon magasin</h2><p class="sub">Les prix de ta liste s'adaptent au magasin choisi.</p></div><button class="close" id="fermer" aria-label="Fermer">✕</button></header>
    <div class="storegrid" id="sg">${MAGASINS.map(([id, n, type]) => opt("radio", "mag2", id, n, type, S.magasin === id, initiales(n))).join("")}</div></div>
  </div></div>`;
  bindModal();
  $("#sg").onchange = e => { S.magasin = e.target.value; save(); fermer(); renderAll(); toast("Prix de " + MAG[S.magasin].n); };
}

function ouvrirPrix() {
  const ids = liste().lignes.map(l => l.p);
  const autres = Object.keys(PR).filter(p => !ids.includes(p));
  const ligne = p => { const k = S.magasin + ":" + p; return `<div class="prow"><div class="pname">${esc(PR[p].name)}<small>Estimation ${eur(Math.round(PR[p].price * MAG[S.magasin].idx * 100) / 100)}</small></div>
    <input type="number" inputmode="decimal" step="0.01" min="0" id="p-${p}" data-prix="${p}" value="${prix(p).toFixed(2)}" class="num ${S.prix[k] != null ? "changed" : ""}" aria-label="Prix ${esc(PR[p].name)}"></div>`; };
  $("#modal").innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Ajuster les prix">
    <div class="in"><header><div><h2>Prix chez ${esc(MAG[S.magasin].n)}</h2><p class="sub">Tape le prix que tu vois dans ton magasin ou ton appli. Il sera retenu pour ce magasin.</p></div><button class="close" id="fermer" aria-label="Fermer">✕</button></header>
    <h4>Dans ta liste cette semaine</h4><div>${ids.map(ligne).join("")}</div>
    <h4>Autres produits</h4><div>${autres.map(ligne).join("")}</div>
    <div class="actions"><button class="btn" id="reset-prix">Remettre les estimations</button></div></div>
  </div></div>`;
  bindModal();
  document.querySelectorAll("[data-prix]").forEach(i => i.onchange = () => {
    const p = i.dataset.prix, k = S.magasin + ":" + p, val = parseFloat(String(i.value).replace(",", "."));
    if (isNaN(val) || val < 0) { i.value = prix(p).toFixed(2); return; }
    S.prix[k] = val; save(); i.classList.add("changed"); renderAll(); toast("Prix enregistré");
  });
  $("#reset-prix").onclick = () => { Object.keys(S.prix).filter(k => k.startsWith(S.magasin + ":")).forEach(k => delete S.prix[k]); save(); fermer(); renderAll(); toast("Estimations remises"); };
}

function fermer() { $("#modal").innerHTML = ""; }
function bindModal() { $("#fermer").onclick = fermer; $("#fermer").focus(); $("#ov").onclick = e => { if (e.target.id === "ov") fermer(); }; }
document.addEventListener("keydown", e => { if (e.key === "Escape") fermer(); });
document.addEventListener("click", e => {
  const v = e.target.closest("[data-voir]"); if (v) return ouvrirRecette(v.dataset.voir);
  const c = e.target.closest("[data-changer]"); if (c) { const [r, i] = c.dataset.changer.split(":"); return ouvrirChanger(r, Number(i)); }
  if (e.target.closest('[data-act="regen"]')) { creerMenu(); renderAll(); toast("Nouveau menu prêt"); }
});
$("#storechip").onclick = ouvrirMagasin;
function majMagasin() { $("#store-name").textContent = MAG[S.magasin].n; $("#store-ini").textContent = initiales(MAG[S.magasin].n); }

let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }

/* Onglets */
const VUES = ["diners", "dejeuners", "ptitdej", "courses", "profil"];
function route() {
  const h = location.hash.slice(1), vue = VUES.includes(h) ? h : "diners";
  VUES.forEach(n => { $("#v-" + n).hidden = n !== vue; });
  document.querySelectorAll("nav.tabbar a").forEach(a => { if (a.dataset.view === vue) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
function renderAll() { majMagasin(); renderDiners(); renderDejeuners(); renderPtitdej(); renderCourses(); renderProfil(); }

// Nettoyage puis premier menu d'exemple
S.menu = S.menu || { diner: [], dej: [], pdj: [] };
["diner", "dej", "pdj"].forEach(k => { S.menu[k] = (S.menu[k] || []).filter(id => R(id)); });
if (!MAG[S.magasin]) S.magasin = "picnic";
if (!S.menu.diner.length) creerMenu();
renderAll(); route();
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
</script>
</body>
</html>
